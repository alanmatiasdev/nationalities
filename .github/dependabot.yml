version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps'
    groups:
      # wrangler declara @cloudflare/workers-types como peer; precisam subir juntos.
      cloudflare:
        patterns:
          - 'wrangler'
          - '@cloudflare/workers-types'
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
